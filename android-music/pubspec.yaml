name: melody_flow
description: "MelodyFlow - Ad-free music streaming from multiple sources"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio playback
  just_audio: any
  audio_service: any

  # State management
  provider: any

  # HTTP & networking
  dio: any
  youtube_explode_dart: any

  # Local storage
  hive: any
  hive_flutter: any
  path_provider: any

  # UI
  google_fonts: any
  cached_network_image: any
  shimmer: any

  # Utilities
  html_unescape: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
