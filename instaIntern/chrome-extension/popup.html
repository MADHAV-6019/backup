<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 300px; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #fafafa; color: #262626; text-align: center; }
        button { width: 100%; padding: 15px; margin-bottom: 10px; background: #0095f6; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background: #1877f2; }
        button.stop { background: #ed4956; }
        .status { font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        .info { font-size: 12px; color: #666; text-align: left; }
    </style>
</head>
<body>
    <h3>Insta Master Bot</h3>
    <div id="status" class="status" style="color: #ed4956;">Status: STOPPED</div>
    <div class="info">
        <p>This bot will automatically open and switch between Reels and Messages tabs to bypass background limits.</p>
        <p><b>Note:</b> Leave this Chrome window open in the background so it can safely switch tabs without interrupting you!</p>
    </div>
    <button id="startBtn">Start Full Automation</button>
    <button id="stopBtn" class="stop">Stop</button>
    <script src="popup.js"></script>
</body>
</html>
